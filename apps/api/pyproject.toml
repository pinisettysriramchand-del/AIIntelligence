[project]
name = "stratiq"
version = "0.1.0"
description = "StratIQ AI Decision Intelligence Platform — Stage 1 API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.17",
  "email-validator>=2.2.0",
  "PyJWT>=2.10.0",
  "bcrypt>=4.2.0",
  "redis>=5.2.0",
  "arq>=0.26.1",
  "qdrant-client>=1.12.0",
  "httpx>=0.28.0",
  "pypdf>=5.1.0",
  "openpyxl>=3.1.5",
  "pandas>=2.2.0",
  "tabulate>=0.9.0",
  "aiofiles>=24.1.0",
  "aiosqlite>=0.20.0",
  "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stratiq"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
